        <path d="M -9 2 L -2 9 L 11 -8" fill="none" stroke="#c8ff62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <text y="47" fill="#96a39a" font-size="11" letter-spacing="1.4">QUALITY</text>
      </g>
      <g transform="translate(300 94)">
        <circle r="40" fill="#1e2b24" stroke="#a7b8ff" stroke-width="1.5" />
        <path d="M -13 9 V -10 M 0 9 V -2 M 13 9 V -17" stroke="#a7b8ff" stroke-width="4" stroke-linecap="round" />
        <text y="59" fill="#96a39a" font-size="11" letter-spacing="1.4">DATA</text>
      </g>
      <g transform="translate(340 202)">
        <circle r="38" fill="#1e2b24" stroke="#c8ff62" stroke-width="1.5" />
        <path d="M -12 0 H 12 M 0 -12 V 12" stroke="#c8ff62" stroke-width="3" stroke-linecap="round" />
        <text y="57" fill="#96a39a" font-size="11" letter-spacing="1.4">AI</text>
      </g>
      <g transform="translate(224 272)">
        <circle r="34" fill="#1e2b24" stroke="#77d9b5" stroke-width="1.5" />
        <rect x="-12" y="-10" width="24" height="20" rx="4" fill="none" stroke="#77d9b5" stroke-width="2" />
        <text y="53" fill="#96a39a" font-size="11" letter-spacing="1.4">SYSTEMS</text>
      </g>
      <g transform="translate(104 232)">
        <circle r="31" fill="#1e2b24" stroke="#a7b8ff" stroke-width="1.5" />
        <path d="M -10 8 L 0 -10 L 10 8 Z" fill="none" stroke="#a7b8ff" stroke-width="2" />
        <text y="50" fill="#96a39a" font-size="11" letter-spacing="1.4">DESIGN</text>
      </g>
