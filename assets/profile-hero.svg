      <path d="M 82 86 L 224 272 M 196 46 L 104 232 M 300 94 L 104 232 M 340 202 L 82 86" fill="none" stroke-opacity="0.14" />
    </g>

    <g fill="#c8ff62" opacity="0.18" filter="url(#softGlow)">
      <circle cx="196" cy="46" r="17" />
      <circle cx="340" cy="202" r="18" />
      <circle cx="104" cy="232" r="16" />
